name: Auto Monthly Report

# 毎月1日に「前月分」の月次レポートを自動生成（2026-10-01 変更）
# - 以前は月末 22:00 JST に当月分を生成していたが、GitHub の schedule は数時間遅れることがあり、
#   月末当日の未明に走って最終日のデータが欠ける／本来の回が翌月にずれて「月末でない」と判定され
#   スキップされる事象が 8月・9月に発生した。
# - 前月分を翌月1日に集計すれば、実行時刻が多少遅れても対象月のデータは確定済みで欠けない。
# - cron 01:00 UTC = 10:00 JST（1日）。数時間遅れても同日中に完了する。
# - 未回答判定はルールベース（キーワード判定）に統一。7・8月の再集計と同じ基準で月次比較できるようにするため、
#   LLM 判定（--use-llm）は使わない。

on:
  schedule:
    - cron: '0 1 1 * *'
  workflow_dispatch:
    inputs:
      target_month:
        description: '対象月 YYYY-MM（空欄なら前月）。過去月の再生成や当月の途中経過に使用'
        required: false
        default: ''
        type: string

jobs:
  auto-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Decide target month
        id: target
        run: |
          # 対象月: target_month 入力があればそれ、なければ前月（JST 基準）
          INPUT_MONTH="${{ github.event.inputs.target_month }}"
          if [ -n "$INPUT_MONTH" ]; then
            YEAR_MONTH="$INPUT_MONTH"
            MODE="manual"
            echo "🎯 Target month override: $YEAR_MONTH"
          else
            YEAR_MONTH=$(TZ='Asia/Tokyo' date -d "$(TZ='Asia/Tokyo' date +%Y-%m-01) -1 day" +%Y-%m)
            MODE="scheduled"
          fi
          echo "year_month=$YEAR_MONTH" >> $GITHUB_OUTPUT
          echo "mode=$MODE" >> $GITHUB_OUTPUT

      - name: Run analysis
        env:
          GBASE_DATASET_ID: ${{ secrets.GBASE_DATASET_ID }}
          GBASE_API_TOKEN: ${{ secrets.GBASE_API_TOKEN }}
        run: |
          if [ -z "$GBASE_DATASET_ID" ] || [ -z "$GBASE_API_TOKEN" ]; then
            echo "❌ GBASE_DATASET_ID または GBASE_API_TOKEN が未設定です。"
            echo "   GitHub Settings > Secrets and variables > Actions で設定してください。"
            exit 1
          fi

          YEAR_MONTH="${{ steps.target.outputs.year_month }}"
          YEAR=$(echo "$YEAR_MONTH" | cut -d'-' -f1)
          MONTH_NUM=$(echo "$YEAR_MONTH" | cut -d'-' -f2)
          MONTH_INT=$((10#$MONTH_NUM))
          START_DATE="${YEAR_MONTH}-01"

          # END_DATE: 対象月が当月（途中経過の手動実行）なら今日、過去月なら月末
          CURRENT_MONTH=$(TZ='Asia/Tokyo' date +%Y-%m)
          if [ "$YEAR_MONTH" = "$CURRENT_MONTH" ]; then
            END_DATE=$(TZ='Asia/Tokyo' date +%Y-%m-%d)
          else
            END_DATE=$(date -d "${YEAR_MONTH}-01 +1 month -1 day" +%Y-%m-%d)
          fi
          PERIOD="${YEAR}年${MONTH_INT}月"

          echo "📊 Analyzing: $PERIOD ($START_DATE ~ $END_DATE) / 未回答判定: ルールベース"

          python3 skill/chatbot-message-analyzer/scripts/analyze.py \
            --dataset-id "$GBASE_DATASET_ID" \
            --token "$GBASE_API_TOKEN" \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --client "NEWoMan高輪" \
            --period "$PERIOD" \
            --output /tmp \
            --site-dir docs \
            --client-slug "newoman-takanawa"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/clients/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            YEAR_MONTH="${{ steps.target.outputs.year_month }}"
            if [ "${{ steps.target.outputs.mode }}" = "manual" ]; then
              COMMIT_MSG="Re-run monthly report: $YEAR_MONTH (manual)"
            else
              COMMIT_MSG="Auto-update monthly report: $YEAR_MONTH (scheduled)"
            fi
            git commit -m "$COMMIT_MSG"
            git push
          fi
